<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="96" fill="#0f1117"/>

  <!-- Bold "N" letter built from 3 shapes -->
  <!-- Left vertical stroke -->
  <rect x="120" y="100" width="64" height="312" fill="#4f8cff"/>
  <!-- Diagonal stroke (parallelogram) -->
  <polygon points="184,100 248,100 392,412 328,412" fill="#4f8cff"/>
  <!-- Right vertical stroke -->
  <rect x="328" y="100" width="64" height="312" fill="#4f8cff"/>

  <!-- Red accent stripe below — gives it a "news brand" feel -->
  <rect x="120" y="440" width="272" height="14" rx="7" fill="#ff5a5a"/>
</svg>
